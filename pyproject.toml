[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diatype"
version = "0.1.0"
description = "Converts natural language into editable Mermaid diagrams with local LLMs inside a hand-drawn notebook interface"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "DiaType Contributors", email = "hello@diatype.dev"}
]
keywords = ["mermaid", "diagram", "llm", "ollama", "notebook", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: Multimedia :: Graphics",
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "ollama>=0.1.7",
    "typer>=0.9.0",
    "jinja2>=3.1.2",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
]

[project.scripts]
diatype = "diatype.cli:app"

[project.urls]
Homepage = "https://github.com/example/diatype"
Repository = "https://github.com/example/diatype"

[tool.setuptools.packages.find]
where = ["src"]
include = ["diatype*"]

[tool.setuptools.package-data]
diatype = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-q --tb=short"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
