<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DiaType — Notebook</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&amp;family=Instrument+Serif:ital@0;1&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.0/dist/mermaid.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&amp;display=swap');

        :root {
            --ink: #5d4037;
            --paper: #f9f4e9;
        }

        .notebook {
            background: #f9f4e9;
            background-image:
                linear-gradient(#e5d9c0 1px, transparent 0),
                linear-gradient(90deg, #e5d9c0 1px, transparent 0);
            background-size: 100% 28px, 28px 100%;
            box-shadow: 8px 12px 0 #3f2a21,
                        0 0 0 16px #5d4037;
            border-radius: 8px 28px 12px 24px;
        }

        .wobbly-border {
            border: 3px solid #5d4037;
            border-radius: 12px 28px 18px 8px;
            box-shadow: 4px 6px 0 #5d4037;
        }

        .sticky-note {
            background: #fefce8;
            box-shadow: 4px 5px 0 #5d4037;
            transform: rotate(-3deg);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="bg-[#d2c3a8] flex items-center justify-center min-h-screen p-8">
    <div class="notebook w-full max-w-6xl p-10">
        <!-- Header -->
        <div class="flex justify-between items-start mb-8">
            <div>
                <h1 class="text-6xl font-bold text-[#5d4037] rotate-[-2deg] inline-block bg-[#fef08c] px-8 py-1 shadow-[4px_6px_0_#3f2a21] rounded-[4px_28px_4px_18px]">
                    DiaType
                </h1>
                <p class="mt-3 text-[#8d6b4f] text-xl font-serif pl-4">sketch • describe • refine</p>
            </div>
            
            <div class="flex gap-3">
                <div onclick="window.location.reload()" 
                     class="sticky-note w-28 h-20 flex items-center justify-center text-center cursor-pointer text-sm leading-tight">
                    New<br>Notebook
                </div>
                <div class="sticky-note w-28 h-20 flex items-center justify-center text-center cursor-pointer text-sm leading-tight bg-[#e0f2fe]"
                     data-prompt="User authentication flow with login, verification and database"
                     data-type="flowchart">
                    Login Flow
                </div>
                <div class="sticky-note w-28 h-20 flex items-center justify-center text-center cursor-pointer text-sm leading-tight"
                     data-prompt="Microservice architecture with API gateway, auth service, payment and database"
                     data-type="flowchart">
                    Microservices
                </div>
            </div>
        </div>

        <div class="grid grid-cols-12 gap-8">
            <!-- Prompt column -->
            <div class="col-span-5">
                <div class="mb-3 flex items-center gap-2">
                    <span class="highlighter px-4 py-1 text-xl">What shall we draw?</span>
                </div>
                
                <textarea id="prompt-input" 
                          class="prompt-area w-full"
                          placeholder="A user logs in, the service checks credentials, then loads the dashboard..."></textarea>
                
                <div class="flex gap-3 mt-4">
                    <button id="generate-btn"
                            class="btn flex-1">✏️ Generate Diagram</button>
                    <button onclick="explainDiagram()" id="explain-btn"
                            class="btn btn-secondary">💬 Explain</button>
                </div>

                <div id="status" class="status mt-6">Ready</div>

                <!-- Gallery -->
                <div class="mt-10">
                    <div class="highlighter text-lg mb-4 inline-block">Template gallery</div>
                    <div class="gallery">
                        <div class="sticky-note text-base" data-prompt="Sequence of CI pipeline steps: build, test, deploy" data-type="sequenceDiagram">
                            CI Pipeline
                        </div>
                        <div class="sticky-note text-base" data-prompt="Class diagram for User, Order and Payment models" data-type="classDiagram">
                            Class Model
                        </div>
                        <div class="sticky-note text-base" data-prompt="ER diagram for blog with posts, comments, users" data-type="erDiagram">
                            Blog DB
                        </div>
                    </div>
                </div>
            </div>

            <!-- Preview column -->
            <div class="col-span-7">
                <div class="mermaid-container wobbly-border relative" id="mermaid-preview">
                    <!-- populated by JS -->
                </div>

                <div id="export-toolbar" class="toolbar mt-6 hidden">
                    <button id="export-svg" class="btn">📤 SVG</button>
                    <button id="export-png" class="btn">🖼️ PNG</button>
                    <button id="export-excalidraw" class="btn">📝 Excalidraw</button>
                    <button id="copy-md" class="btn">📋 Copy MD</button>
                </div>

                <div class="mt-8">
                    <label class="block text-[#8d6b4f] text-sm mb-2 font-medium">Mermaid source (editable)</label>
                    <textarea id="mermaid-code" 
                              class="code-editor w-full font-mono text-sm h-52"></textarea>
                </div>

                <!-- Refinement -->
                <div class="mt-8 pt-6 border-t border-[#d4b99e]">
                    <form id="refine-form" class="flex gap-3">
                        <input id="refine-instruction" 
                               type="text"
                               class="flex-1 prompt-area h-12 text-base"
                               placeholder="make the arrows thicker, add a retry loop...">
                        <button type="submit"
                                class="btn px-8">Refine</button>
                    </form>
                </div>

                <div id="explanation" class="mt-8 p-6 bg-[#fefce8] border-2 border-[#5d4037] rounded-3xl text-[#5d4037] leading-relaxed min-h-[110px]">
                    <span class="highlighter">Explanation</span><br>
                    Your diagram will be explained here.
                </div>
            </div>
        </div>

        <div class="text-center text-[#8d6b4f] text-xs mt-12 font-serif">
            Local • Private • Hand-drawn • Powered by Ollama + Mermaid + Excalidraw
        </div>
    </div>

    <script src="/static/js/main.js"></script>
</body>
</html>
